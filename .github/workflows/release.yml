name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tests/test_debinfo.py && python3 tests/test_archconv.py
      - run: python3 tools/build_deb.py dist
      - name: Publish the .deb
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.ref_name }}" dist/*.deb --clobber || gh release create "${{ github.ref_name }}" dist/*.deb --generate-notes
